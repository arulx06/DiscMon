name: dependency-audit

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r <(python -m pip freeze) || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd apps/web && npm audit --audit-level=high || true
