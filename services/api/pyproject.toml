[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discmon-api"
version = "0.1.0"
description = "DiscMon private career intelligence API, collectors and workers"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0",
  "psycopg[binary]>=3.2.9,<4.0",
  "alembic>=1.16,<2.0",
  "httpx>=0.28,<1.0",
  "feedparser>=6.0.11,<7.0",
  "beautifulsoup4>=4.13,<5.0",
  "bleach>=6.2,<7.0",
  "python-dateutil>=2.9,<3.0",
  "apscheduler>=3.11,<4.0",
  "PyYAML>=6.0.2,<7.0",
  "google-auth[requests]>=2.40,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.0,<2.0",
  "anyio>=4.9,<5.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.16,<2.0",
  "types-python-dateutil>=2.9",
  "types-bleach>=6.1",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:apscheduler.*",
]
markers = [
  "integration: requires a real PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
